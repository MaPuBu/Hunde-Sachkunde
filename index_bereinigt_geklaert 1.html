tig: Durch eine regelmäßige Entwurmung werden eventuell vorhandene Würmer abgetötet.."},{"id":"buch-135","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Was ist im Sommer bei hohen Temperaturen zu beachten?","answers":["Schönes warmes Wetter sollte zu Tageswanderungen genutzt werden.","Für kurzhaarige Hunde ist nichts zu beachten, langhaarige Hunde sollten im Hochsommer max. 3 Stunden täglich spazieren geführt werden.","Hunde mit kurzem Fell müssen grundsätzlich mit Sonnenmilch eingerieben werden, um Verbrennungen zu vermeiden.","Hunde sollten im Sommer nicht in parkenden Autos zurückgelassen werden."],"correct":[3],"multi":false,"source":"Buch","bookNumber":135,"explanation":"Richtig: Hunde sollten im Sommer nicht in parkenden Autos zurückgelassen werden.."},{"id":"buch-136","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Gibt es Nachteile, wenn man mehr als einen Hund hält?","answers":["Ja, man muss doppelt so oft spazieren gehen.","Ja, man muss zwei Sachkundeprüfungen ablegen.","Ja, man muss doppelte Kosten für Futter, Tierarzt, Hundesteuer, Versicherung, Ausstattung usw. tragen.","Ja, die Hunde streiten sich oft ums Futter."],"correct":[2],"multi":false,"source":"Buch","bookNumber":136,"explanation":"Richtig: Ja, man muss doppelte Kosten für Futter, Tierarzt, Hundesteuer, Versicherung, Ausstattung usw. tragen.."},{"id":"buch-137","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie verhalten Sie sich, wenn Sie mit Ihrem Hund einen sehr ängstlichen Menschen passieren müssen?","answers":["Ich nehme meinen Hund zu mir und führe ihn kontrolliert an der Person vorbei.","Ich lasse den Hund frei laufen, damit die Person merkt, dass vom Hund keine Gefahr ausgeht.","Ich lasse den Hund Kontakt aufnehmen.","Ich bleibe direkt neben der Person stehen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":137,"explanation":"Richtig: Ich nehme meinen Hund zu mir und führe ihn kontrolliert an der Person vorbei.."},{"id":"buch-138","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie verhalten Sie sich, wenn Ihnen beim Spaziergang Jogger oder Radfahrer entgegenkommen?","answers":["Der Hund darf weiter frei laufen, wenn er freundlich ist.","Ich nehme den Hund unter Kontrolle und gebe den anderen ausreichend Raum.","Ich lasse die Leine quer über den Weg gespannt.","Ich lasse den Hund hinterherlaufen, wenn er nur spielen will."],"correct":[1],"multi":false,"source":"Buch","bookNumber":138,"explanation":"Richtig: Ich nehme den Hund unter Kontrolle und gebe den anderen ausreichend Raum.."},{"id":"buch-139","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Was sollten Kinder beim Umgang mit einem fremden Hund beachten?","answers":["Sie sollten den Hund nicht ungefragt anfassen, bedrängen oder umarmen.","Sie können jeden Hund streicheln, wenn sie langsam hingehen.","Sie sollten dem Hund direkt in die Augen schauen.","Sie sollten weglaufen, wenn der Hund näherkommt."],"correct":[0],"multi":false,"source":"Buch","bookNumber":139,"explanation":"Richtig: Sie sollten den Hund nicht ungefragt anfassen, bedrängen oder umarmen."},{"id":"buch-140","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie verhalten Sie sich, wenn ein fremder Hund auf Sie und Ihren Hund zuläuft?","answers":["Sie lassen Ihren Hund sofort von der Leine.","Sie ziehen Ihren Hund an der Leine direkt zu sich und schreien den fremden Hund an.","Sie rennen mit Ihrem Hund davon.","Sie bleiben möglichst ruhig und versuchen, die Situation kontrolliert zu lösen."],"correct":[3],"multi":false,"source":"Buch","bookNumber":140,"explanation":"Richtig: Sie bleiben möglichst ruhig und versuchen, die Situation kontrolliert zu lösen.."},{"id":"buch-141","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Was ist bei Begegnungen mit angeleinten Hunden zu beachten?","answers":["Angeleinte Hunde sollten grundsätzlich begrüßt werden.","Man sollte die Leinen möglichst kurz halten und die Hunde frontal zusammenführen.","Kontakt sollte kontrolliert und nicht erzwungen werden.","Angeleinte Hunde dürfen niemals Kontakt haben."],"correct":[2],"multi":false,"source":"Buch","bookNumber":141,"explanation":"Richtig: Kontakt sollte kontrolliert und nicht erzwungen werden.."},{"id":"buch-142","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie verhalten Sie sich mit Ihrem Hund gegenüber einer Gruppe spielender Kinder?","answers":["Ich lasse den Hund in die Gruppe laufen, damit er Kinder kennenlernt.","Ich kontrolliere den Hund und passe den Abstand an.","Ich bitte die Kinder, den Hund zu füttern.","Ich lasse den Hund hinter den Kindern herlaufen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":142,"explanation":"Richtig: Ich kontrolliere den Hund und passe den Abstand an.."},{"id":"buch-143","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie sollten Kinder auf einen unbekannten Hund zugehen?","answers":["Ruhig, ohne den Hund zu bedrängen, und zunächst den Halter fragen.","Direkt von vorne und mit ausgestreckten Armen.","Schnell hinlaufen, damit der Hund nicht erschrickt.","Den Hund sofort umarmen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":143,"explanation":"Richtig: Ruhig, ohne den Hund zu bedrängen, und zunächst den Halter fragen.."},{"id":"buch-144","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Was sollten Sie tun, wenn ein Hund Sie bedroht?","answers":["Davonrennen.","Den Hund laut anschreien.","Den Hund anstarren.","Ruhig bleiben, direkten Blickkontakt vermeiden und Distanz schaffen."],"correct":[3],"multi":false,"source":"Buch","bookNumber":144,"explanation":"Richtig: Ruhig bleiben, direkten Blickkontakt vermeiden und Distanz schaffen.."},{"id":"buch-145","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Was ist bei einer Beißerei zwischen Hunden zu beachten?","answers":["Man sollte grundsätzlich mit den Händen zwischen die Hunde greifen.","Man sollte die Hunde am Halsband auseinanderziehen.","Man sollte den Eigenschutz beachten und nicht unüberlegt zwischen die Hunde greifen.","Man sollte die Hunde durch Schläge trennen."],"correct":[2],"multi":false,"source":"Buch","bookNumber":145,"explanation":"Richtig: Man sollte den Eigenschutz beachten und nicht unüberlegt zwischen die Hunde greifen.."},{"id":"buch-146","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie verhalten Sie sich, wenn ein fremder Hund Sie anknurrt?","answers":["Ich gehe näher heran, damit er merkt, dass ich keine Angst habe.","Ich versuche, ihn zu streicheln.","Ich bleibe ruhig, vermeide Bedrängung und schaffe Abstand.","Ich laufe sofort weg."],"correct":[2],"multi":false,"source":"Buch","bookNumber":146,"explanation":"Richtig: Ich bleibe ruhig, vermeide Bedrängung und schaffe Abstand.."},{"id":"buch-147","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Was tun Sie, wenn ein fremder Hund Ihren Hund verfolgt?","answers":["Ich versuche, ruhig zu bleiben und die Situation kontrolliert zu beenden.","Ich trete nach dem fremden Hund.","Ich lasse meinen Hund grundsätzlich frei, damit er schneller weglaufen kann.","Ich renne mit meinem Hund davon."],"correct":[0],"multi":false,"source":"Buch","bookNumber":147,"explanation":"Richtig: Ich versuche, ruhig zu bleiben und die Situation kontrolliert zu beenden.."},{"id":"buch-148","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Wie verhalten Sie sich gegenüber einem fremden, knurrenden Hund?","answers":["Ich fasse ihm auf den Kopf.","Ich schaue ihm direkt in die Augen.","Ich bedränge ihn nicht und vergrößere die Distanz.","Ich drehe mich um und renne weg."],"correct":[2],"multi":false,"source":"Buch","bookNumber":148,"explanation":"Richtig: Ich bedränge ihn nicht und vergrößere die Distanz.."},{"id":"buch-149","topic":"gefahrensituationen","topicName":"Gefahrensituationen","question":"Was ist bei einer Fahrradtour mit Hund zu beachten?","answers":["Jeder Hund kann ohne Training am Fahrrad laufen.","Hunde sollten auf langen Strecken grundsätzlich im Galopp laufen.","Das Fahrradfahren ersetzt alle anderen Formen der Beschäftigung.","Der Hund sollte gesund, ausgewachsen und schrittweise an das Laufen am Fahrrad gewöhnt sein."],"correct":[3],"multi":false,"source":"Buch","bookNumber":149,"explanation":"Richtig: Der Hund sollte gesund, ausgewachsen und schrittweise an das Laufen am Fahrrad gewöhnt sein.."},{"id":"buch-150","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Welche Versicherung ist für Hundehalter besonders wichtig?","answers":["Eine Hundehalter-Haftpflichtversicherung.","Eine Hausratversicherung.","Eine Reisegepäckversicherung.","Eine Rechtsschutzversicherung ersetzt die Hundehalter-Haftpflicht."],"correct":[0],"multi":false,"source":"Buch","bookNumber":150,"explanation":"Richtig: Eine Hundehalter-Haftpflichtversicherung.."},{"id":"buch-151","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Wie muss ein Hund im Auto transportiert werden?","answers":["So gesichert, dass er den Fahrer nicht behindert und bei einem Unfall nicht unkontrolliert durch das Fahrzeug geschleudert wird.","Immer auf dem Beifahrersitz.","Kleine Hunde dürfen ungesichert auf dem Schoß sitzen.","Im Kofferraum ist nie eine Sicherung nötig."],"correct":[0],"multi":false,"source":"Buch","bookNumber":151,"explanation":"Richtig: So gesichert, dass er den Fahrer nicht behindert und bei einem Unfall nicht unkontrolliert durch das Fahrzeug geschleudert wird.."},{"id":"buch-152","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Wer haftet grundsätzlich für Schäden, die ein Hund verursacht?","answers":["Immer die Gemeinde.","Nur derjenige, der den Hund gerade führt.","Grundsätzlich der Tierhalter.","Niemand, wenn der Hund unbeaufsichtigt war."],"correct":[2],"multi":false,"source":"Buch","bookNumber":152,"explanation":"Richtig: Grundsätzlich der Tierhalter.."},{"id":"buch-153","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Was ist zu beachten, wenn eine andere Person Ihren Hund ausführt?","answers":["Nichts, der Hundehalter haftet dann nie.","Die Person sollte in der Lage sein, den Hund sicher zu führen und die geltenden Regeln einzuhalten.","Der Hund darf nur von Familienmitgliedern geführt werden.","Eine andere Person braucht grundsätzlich einen Führerschein."],"correct":[1],"multi":false,"source":"Buch","bookNumber":153,"explanation":"Richtig: Die Person sollte in der Lage sein, den Hund sicher zu führen und die geltenden Regeln einzuhalten.."},{"id":"buch-154","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Welche Aussage zur Hundehalterhaftung ist richtig?","answers":["Der Halter haftet nur, wenn er vorsätzlich gehandelt hat.","Der Halter kann für Schäden seines Hundes auch ohne eigenes Verschulden haften.","Für Hundeschäden haftet immer die private Haftpflichtversicherung.","Bei einem angeleinten Hund gibt es keine Haftung."],"correct":[1],"multi":false,"source":"Buch","bookNumber":154,"explanation":"Richtig: Der Halter kann für Schäden seines Hundes auch ohne eigenes Verschulden haften.."},{"id":"buch-155","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Was ist nach einem Beißvorfall zu beachten?","answers":["Verletzte Personen müssen versorgt werden; je nach Vorfall können Behörden und Versicherungen zu informieren sein.","Der Hund muss sofort abgegeben werden.","Der Vorfall darf niemandem gemeldet werden.","Der Halter muss den Hund selbst bestrafen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":155,"explanation":"Richtig: Verletzte Personen müssen versorgt werden; je nach Vorfall können Behörden und Versicherungen zu informieren sein.."},{"id":"buch-156","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Welche Aussage zum Tierschutz ist richtig?","answers":["Einem Tier dürfen ohne vernünftigen Grund keine Schmerzen, Leiden oder Schäden zugefügt werden.","Erziehungsmethoden sind vom Tierschutzrecht grundsätzlich ausgenommen.","Bei Hunden darf jedes Hilfsmittel eingesetzt werden.","Das Tierschutzrecht gilt nur für gewerblich gehaltene Tiere."],"correct":[0],"multi":false,"source":"Buch","bookNumber":156,"explanation":"Richtig: Einem Tier dürfen ohne vernünftigen Grund keine Schmerzen, Leiden oder Schäden zugefügt werden."},{"id":"buch-157","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Wo können besondere Vorschriften zur Leinenpflicht gelten?","answers":["Nur auf Privatgrundstücken.","Nur in Tierarztpraxen.","Nur im Ausland.","In kommunalen Satzungen und örtlichen Regelungen."],"correct":[3],"multi":false,"source":"Buch","bookNumber":157,"explanation":"Richtig: In kommunalen Satzungen und örtlichen Regelungen.."},{"id":"buch-158","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Darf ein Hund allein in einem Fahrzeug bleiben?","answers":["Nein, das ist laut Tierschutz-Hundeverordnung nicht erlaubt.","Ja, wenn der Hund daran gewöhnt ist.","Ja, aber maximal für eine Stunde.","Ja, aber nur, wenn für ausreichend Frischluft und angemessene Temperaturen gesorgt ist."],"correct":[3],"multi":false,"source":"Buch","bookNumber":158,"explanation":"Richtig: Ja, aber nur, wenn für ausreichend Frischluft und angemessene Temperaturen gesorgt ist.."},{"id":"buch-159","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Welche Haltungsform ist laut Tierschutz-Hundeverordnung erlaubt?","answers":["Die Haltung eines Hundes im dunklen Keller.","Den Hund ohne Kontakt zu Sozialpartnern zu halten.","Die Zwingerhaltung in Anbindung.","Zwingerhaltung, wenn eine Schutzhütte vorhanden ist und der Hund u.a. täglich Sozialkontakt bek function examQ(){chrome(0);let q=set[pos],saved=exa[q.id]||[],answered=Object.values(exa).filter(x=>x.length).length;V.innerHTML=`<button class="back" id="abort">← Abbrechen</button><div class="small"><b>${answered}/40 beantwortet</b> • ${40-answered} offen</div>`+markup(q,pos+1,40)+`<div class="twocol"><button class="back" id="prev">← Zurück</button><button class="primary" id="next">${pos===39?'Prüfung abgeben':'Weiter →'}</button></div><button class="reset" id="early">Prüfung jetzt abgeben</button>`;V.querySelector('#abort').onclick=examHome;let bs=[...V.querySelectorAll('.answer')];bs.forEach((b,i)=>{b.classList.toggle('selected',saved.includes(i));b.onclick=()=>{let s=exa[q.id]||[],n=+b.dataset.i;if(q.multi){s.includes(n)?s=s.filter(x=>x!==n):s.push(n)}else s=[n];s.sort((a,b)=>a-b);exa[q.id]=s;bs.forEach((x,j)=>x.classList.toggle('selected',s.includes(j)))}});V.querySelector('#prev').disabled=pos===0;V.querySelector('#prev').onclick=()=>{if(pos){pos--;examQ()}};V.querySelector('#next').onclick=()=>{if(pos<39){pos++;examQ()}else confirmSubmit()};V.querySelector('#early').onclick=confirmSubmit}
function confirmSubmit(){let answered=Object.values(exa).filter(x=>x.length).length;M.innerHTML=`<div class="overlay"><div class="dialog"><h3>Prüfung abgeben?</h3><p>${answered}/40 beantwortet. ${40-answered} offene Fragen werden als falsch gewertet.</p><div class="twocol"><button class="cancel">Abbrechen</button><button class="yes">Abgeben</button></div></div></div>`;M.querySelector('.cancel').onclick=()=>M.innerHTML='';M.querySelector('.yes').onclick=()=>{M.innerHTML='';result()}}
let lastErrors=[];function result(){chrome(1);let good=0,bad=[];set.forEach(q=>{let a=exa[q.id]||[];if(eq(a,q.correct))good++;else{bad.push({q,a});ts(q.topic)[q.id]='bad'}});lastErrors=bad.map(x=>x.q);save();let pass=good>=30;V.innerHTML=`<div class="score">${Math.round(good/40*100)}%</div><div class="verdict ${pass?'pass':'fail'}">${pass?'✅ BESTANDEN':'❌ NICHT BESTANDEN'}</div><h3 style="text-align:center">${good} von 40 richtig</h3><h3>❌ Fehlerauswertung</h3>`+bad.map(x=>`<div class="badcard"><b>${x.q.question}</b><div class="mine">🔴 Deine Antwort: ${x.a.length?x.a.map(i=>x.q.answers[i]).join(', '):'nicht beantwortet'}</div><div class="right">🟢 Richtig: ${x.q.correct.map(i=>x.q.answers[i]).join(', ')}</div><div class="small">💡 ${x.q.explanation}</div></div>`).join('')+`<button class="primary" id="err">❌ Nur meine Prüfungsfehler üben</button><button class="primary" id="eh">Prüfungsübersicht</button>`;V.querySelector('#err').onclick=()=>{set=sh(lastErrors);pos=score=0;cur=set[0]?.topic||'recht_rlp';learnQ()};V.querySelector('#eh').onclick=examHome}
function reset(one){M.innerHTML=`<div class="overlay"><div class="dialog"><h3>🗑️ ${one?'Dieses Thema':'Gesamten Lernstand'} zurücksetzen?</h3><p>${one?'Alle Ergebnisse dieses Themas werden gelöscht.':'Alle Lernstände und Fehlerlisten werden gelöscht.'}</p><div class="twocol"><button class="cancel">Abbrechen</button><button class="yes">Ja, löschen</button></div></div></div>`;M.querySelector('.cancel').onclick=()=>M.innerHTML='';M.querySelector('.yes').onclick=()=>{if(one)delete state[cur];else state={};save();M.innerHTML='';one?menu(cur):home()}}
L.onclick=home;E.onclick=examHome;home();
</script></body></html>
