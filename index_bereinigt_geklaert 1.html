const Q=[{"id":"buch-001","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Wie alt sind die ältesten Spuren des Haushundes?","answers":["5.000 Jahre","5.000–10.000 Jahre","15.000–40.000 Jahre","Über 50.000 Jahre","Circa 100.000 Jahre"],"correct":[2],"multi":false,"source":"Buch","bookNumber":1,"explanation":"Richtig: 15.000–40.000 Jahre."},{"id":"buch-002","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Welches sind die Vorfahren aller Hunde?","answers":["Hyänen","Coyoten","Füchse","Wölfe","Schakale"],"correct":[3],"multi":false,"source":"Buch","bookNumber":2,"explanation":"Richtig: Wölfe."},{"id":"buch-003","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Alle Hunde stammen vom Wolf ab. Dennoch gibt es große Unterschiede, welche?","answers":["Es gibt keine. Hunde verhalten sich genauso wie Wölfe.","Hunde reagieren im Gegensatz zu den meisten Wölfen auf gezielte körpersprachliche Signale des Menschen und erlernen durch die Verknüpfung von Verhalten und Belohnung zuverlässig Sicht- und Hörzeichen.","Hunde können im Gegensatz zu Wölfen nicht in großen Rudeln leben.","Hunde fressen kein Fleisch.","Hunde können nicht heulen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":3,"explanation":"Richtig: Hunde reagieren im Gegensatz zu den meisten Wölfen auf gezielte körpersprachliche Signale des Menschen und erlernen durch die Verknüpfung von Verhalten und Belohnung zuverlässig Sicht- und Hörzeichen.."},{"id":"buch-004","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Was versteht man unter der „Domestikation des Hundes“?","answers":["Zuchtauslese auf ein bestimmtes Merkmal, z.B. Stehohren","Verpaarung von Geschwistern","Zuchtauslese auf eine bestimmte Eignung, z.B. Blindenführhund","Die Haustierwerdung vom Wolf zum Haushund","Fremdeinkreuzung in eine bestehende Rasse"],"correct":[3],"multi":false,"source":"Buch","bookNumber":4,"explanation":"Richtig: Die Haustierwerdung vom Wolf zum Haushund."},{"id":"buch-005","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Wie viele Hunde leben in Deutschland?","answers":["Circa 5 Millionen","Circa 10 Millionen","Circa 20 Millionen","Circa 30 Millionen","Circa 100.000 Millionen"],"correct":[1],"multi":false,"source":"Buch","bookNumber":5,"explanation":"Richtig: Circa 10 Millionen."},{"id":"buch-006","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Was kostet ein Welpe aus einem seriösen Züchterhaushalt durchschnittlich?","answers":["100 bis 200 Euro","250 bis 500 Euro","600 bis 1800 Euro","2000 Euro","Unter 100 Euro"],"correct":[2],"multi":false,"source":"Buch","bookNumber":6,"explanation":"Richtig: 600 bis 1800 Euro."},{"id":"buch-007","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Wie viel kostet das Futter, das ein Hund monatlich verbraucht, durchschnittlich?","answers":["25 bis 50 Euro","75 bis 150 Euro","10 bis 15 Euro","Über 150 Euro","5 bis 10 Euro"],"correct":[0],"multi":false,"source":"Buch","bookNumber":7,"explanation":"Richtig: 25 bis 50 Euro."},{"id":"buch-008","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Was fällt jährlich durchschnittlich an Impfkosten an?","answers":["35 bis 60 Euro","60 bis 80 Euro","10 bis 20 Euro","90 bis 110 Euro","Über 110 Euro"],"correct":[0],"multi":false,"source":"Buch","bookNumber":8,"explanation":"Richtig: 35 bis 60 Euro."},{"id":"buch-009","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Wie viele verschiedene Hunderassen gibt es schätzungsweise weltweit?","answers":["Über 800","Über 100","Über 300","Über 200","Über 1.000"],"correct":[2],"multi":false,"source":"Buch","bookNumber":9,"explanation":"Richtig: Über 300."},{"id":"buch-010","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Welche Hunde bezeichnet man als „Mischlinge“?","answers":["Nachkommen von Eltern gleicher Rasse, die aber noch keine Zuchttauglichkeitsprüfung abgelegt haben.","Nachkommen von Eltern, die aus verschiedenen Ländern stammen.","Nachkommen von Eltern gleicher Rasse, bei denen aber ein Elternteil das festgesetzte Zuchtalter deutlich überschritten hat.","Nachkommen von Eltern gleicher Rasse, die aber ein deutlich unterschiedliches Temperament haben.","Nachkommen von Eltern unterschiedlicher Rassen oder solchen, die keiner Rasse angehören."],"correct":[4],"multi":false,"source":"Buch","bookNumber":10,"explanation":"Richtig: Nachkommen von Eltern unterschiedlicher Rassen oder solchen, die keiner Rasse angehören.."},{"id":"buch-011","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Sind alle Hunde gleich oder gibt es rassetypische Eigenschaften?","answers":["Alle Hunde sind gleich.","Je nach Rasse weisen die Hunde unterschiedliche Veranlagungen auf.","Verschiedene Rassen unterscheiden sich nur durch ihr äußeres Erscheinungsbild.","Rassetypische Eigenschaften gibt es nicht, aber anhand der Größe kann man eine Einteilung in „kinderfreundlich“, „gefährlich“, „leicht zu erziehen“ etc. treffen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":11,"explanation":"Richtig: Je nach Rasse weisen die Hunde unterschiedliche Veranlagungen auf.."},{"id":"buch-012","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Sie wollen einen Welpen kaufen. Wie gehen Sie vor?","answers":["Sie suchen im Anzeigenteil Ihrer Tageszeitung nach einem günstigen Angebot.","Sie wenden sich an den VDH oder einen entsprechenden Zuchtverein und bitten um Züchteranschriften.","Sie suchen einen Züchter, der möglichst viele Rassen zur Auswahl hat. Der hat viel Erfahrung!","Sie surfen im Internet und suchen nach einem Schnäppchen.","Sie meiden auf jeden Fall den Züchter, der Sie als künftigen Hundehalter zu genau unter die Lupe nimmt."],"correct":[1],"multi":false,"source":"Buch","bookNumber":12,"explanation":"Richtig: Sie wenden sich an den VDH oder einen entsprechenden Zuchtverein und bitten um Züchteranschriften.."},{"id":"buch-013","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Ab welchem Alter dürfen Hundewelpen laut Tierschutzhundeverordnung von ihrer Mutter getrennt werden?","answers":["Älter als 12 Wochen","Älter als 9 Wochen","Älter als 8 Wochen","Älter als 4 Wochen","Älter als 16 Wochen"],"correct":[2],"multi":false,"source":"Buch","bookNumber":13,"explanation":"Richtig: Älter als 8 Wochen."},{"id":"buch-014","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Sie möchten einen Hund anschaffen und haben ein oder mehrere kleinere Kinder. Welche Entscheidung wäre günstig?","answers":["Sie suchen einen Hund aus dem Tierheim und hoffen, dass es gut geht.","Sie schaffen sich einen älteren, ruhigen Hund an, da diese mit Kindern immer besser klarkommen.","Sie holen im Vorfeld Informationen zu Charakter und Haltungsanforderungen diverser Hunderassen ein und wählen dann einen zu Ihnen passenden Hund.","Mit mehreren Kindern sollte man davon absehen, sich einen Hund zuzulegen."],"correct":[2],"multi":false,"source":"Buch","bookNumber":14,"explanation":"Richtig: Sie holen im Vorfeld Informationen zu Charakter und Haltungsanforderungen diverser Hunderassen ein und wählen dann einen zu Ihnen passenden Hund.."},{"id":"buch-015","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Wenn man einen Welpen kauft, sollte man …","answers":["besonders in der ersten Phase viel Zeit (ggf. Urlaub) haben, um sich bestmöglich um den Hund kümmern zu können.","den Züchter gut aussuchen, nur VDH-Züchter haben gute Hunde.","unbedingt einen Garten haben, denn sonst ist es sehr problematisch, den Hund stubenrein zu bekommen.","sicher sein, dass der Hund auch ins Auto passt."],"correct":[0],"multi":false,"source":"Buch","bookNumber":15,"explanation":"Richtig: besonders in der ersten Phase viel Zeit (ggf. Urlaub) haben, um sich bestmöglich um den Hund kümmern zu können.."},{"id":"buch-016","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Unter welchen Umständen sollte man davon absehen sich einen Hund anzuschaffen?","answers":["Bei Berufstätigkeit, wenn der Hund mehr als sechs Stunden täglich alleine sein müsste.","Wenn man einen alten Hund zu Hause hat, das würde schief gehen.","Wenn man keinen Garten hat.","Wenn man kleine Kinder zu Hause hat."],"correct":[0],"multi":false,"source":"Buch","bookNumber":16,"explanation":"Richtig: Bei Berufstätigkeit, wenn der Hund mehr als sechs Stunden täglich alleine sein müsste.."},{"id":"buch-017","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Wie alt kann ein Hund werden?","answers":["Ca. 7 Jahre.","Kleine Rassen 3-5 Jahre, große Rassen meistens 16 Jahre.","In Abhängigkeit von Größe und Gewicht der jeweiligen Rasse etwa 8-16 Jahre.","25-30 Jahre, wenn keine gefährlichen Krankheiten auftreten."],"correct":[2],"multi":false,"source":"Buch","bookNumber":17,"explanation":"Richtig: In Abhängigkeit von Größe und Gewicht der jeweiligen Rasse etwa 8-16 Jahre.."},{"id":"buch-018","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Welche Kriterien zeichnen einen empfehlenswerten Züchter aus?","answers":["Die Hunde kommen aus einem Zwinger in ruhiger Lage auf dem Land.","Der Züchter hat viele verschiedene Rassen zur Auswahl.","Die Welpen werden Ihnen gebracht, damit Sie keine Krankheit in die Zucht einschleppen.","Die Hunde leben mit familiärem Anschluss im Haus mit Garten, nur ein Wurf ist vorhanden."],"correct":[3],"multi":false,"source":"Buch","bookNumber":18,"explanation":"Richtig: Die Hunde leben mit familiärem Anschluss im Haus mit Garten, nur ein Wurf ist vorhanden.."},{"id":"buch-019","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Wann sollte man vom Welpenkauf absehen?","answers":["Die Hunde haben keine Papiere.","Die Welpen weichen dem Züchter aus.","Der Züchter hat mehrere Zuchthündinnen.","Die Welpen hören nicht auf Kommandos und springen an Ihnen hoch."],"correct":[1],"multi":false,"source":"Buch","bookNumber":19,"explanation":"Richtig: Die Welpen weichen dem Züchter aus.."},{"id":"buch-020","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Wofür steht die Abkürzung VDH?","answers":["Verband für das Deutsche Hundewesen","Verband der Hunde","Verband der Hundehalter","Verein der Hundezüchter","Verein der Hundefreunde"],"correct":[0],"multi":false,"source":"Buch","bookNumber":20,"explanation":"Richtig: Verband für das Deutsche Hundewesen."},{"id":"buch-021","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Welche Aufgaben hat der VDH?","answers":["Immer mehr neue Rassen zu züchten","Die Förderung ausschließlich deutscher Hunderassen","Interessenvertretung aller Hundehalter und Förderung der Zucht von gesunden und verhaltenssicheren Rassehunden, außerdem die Erziehung, Ausbildung und Beschäftigung mit Hunden.","Neue Gesetze zur Hundehaltung zu erlassen","Neue Hundevereine zu gründen"],"correct":[2],"multi":false,"source":"Buch","bookNumber":21,"explanation":"Richtig: Interessenvertretung aller Hundehalter und Förderung der Zucht von gesunden und verhaltenssicheren Rassehunden, außerdem die Erziehung, Ausbildung und Beschäftigung mit Hunden.."},{"id":"buch-022","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Wofür steht das VDH-Gütesiegel?","answers":["Für Hunde mit vielen Championtiteln","Für Hunde aus kontrollierter Zucht","Für Hunde ohne Ahnentafeln","Für Hunde aus dem Ausland","Für Hunde aus dem Zoofachhandel"],"correct":[1],"multi":false,"source":"Buch","bookNumber":22,"explanation":"Richtig: Für Hunde aus kontrollierter Zucht."},{"id":"buch-023","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Worüber informiert die Ahnentafel eines Hundes?","answers":["Über seine Abstammung","Über seine Zuchttauglichkeit","Über seinen Gesundheitszustand","Über seinen Formwert","Über seine Charaktereigenschaften"],"correct":[0],"multi":false,"source":"Buch","bookNumber":23,"explanation":"Richtig: Über seine Abstammung."},{"id":"buch-024","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Welche gesundheitlich unbedenklichen und zeitlich begrenzten Alternativen bieten sich anstelle einer Kastration des Rüden?","answers":["Eine Sterilisation","Regelmäßige Tablettengabe","Ein Implantat (GnRH), das bis zu einem Jahr eine Kastration simuliert.","Der Hund wird nur noch an der Leine geführt.","Der Hund wird im Zwinger gehalten."],"correct":[2],"multi":false,"source":"Buch","bookNumber":24,"explanation":"Richtig: Ein Implantat (GnRH), das bis zu einem Jahr eine Kastration simuliert.."},{"id":"buch-025","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Werden Hündinnen kastriert oder sterilisiert?","answers":["Sie werden immer sterilisiert","Sie werden in der Regel kastriert, weil bei einer Sterilisation nur die Eileiter abgebunden werden, die Eierstöcke aber erhalten bleiben und zu bösartigen Veränderungen neigen können.","Man kann zwischen beiden Methoden wählen, sie sind gleich gut.","Weder eine Kastration noch eine Sterilisierung sind bei der Hündin möglich.","Sie werden bereits sterilisiert geboren."],"correct":[1],"multi":false,"source":"Buch","bookNumber":25,"explanation":"Richtig: Sie werden in der Regel kastriert, weil bei einer Sterilisation nur die Eileiter abgebunden werden, die Eierstöcke aber erhalten bleiben und zu bösartigen Veränderungen neigen können.."},{"id":"buch-026","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Wann setzt durchschnittlich die erste Hitze der Hündin ein?","answers":["Zwischen dem 3. und 4. Lebensmonat","13-17 Monate","Zwischen dem 18. und 20. Lebensmonat","Über 24 Monate","Zwischen dem 6. und 12. Lebensmonat"],"correct":[4],"multi":false,"source":"Buch","bookNumber":26,"explanation":"Richtig: Zwischen dem 6. und 12. Lebensmonat."},{"id":"buch-027","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Wie kann man einen Hund am sichersten kennzeichnen, damit er ein Leben lang eindeutig erkennbar ist?","answers":["Mit einer Tätowierung","Ich klebe sein Foto in den Heimtierausweis","Mit einem Chip","Mit Farbe","Mit einem auffälligen Halsband"],"correct":[2],"multi":false,"source":"Buch","bookNumber":27,"explanation":"Richtig: Mit einem Chip."},{"id":"buch-028","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Aus welchem Grund sollten Hunde durch einen Mikrochip gekennzeichnet werden?","answers":["Nur so dürfen Züchter ihre Welpen abgeben.","Nur Rassehunde benötigen laut Tierzuchtgesetz eine Kennzeichnung.","Weil es ermöglicht, einen Hund zu identifizieren und seinem Besitzer zuzuordnen.","Um eine Verwechslung mit anderen Hunden zu vermeiden."],"correct":[2],"multi":false,"source":"Buch","bookNumber":28,"explanation":"Richtig: Weil es ermöglicht, einen Hund zu identifizieren und seinem Besitzer zuzuordnen.."},{"id":"buch-029","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Sie planen mit Ihrem Hund innerhalb der EU zu verreisen. Was ist unbedingt erforderlich, um den Hund mitführen zu dürfen?","answers":["Es gibt diesbezüglich keine EU-Vorschriften.","Ein tierärztliches Gesundheits-Gutachten und einen EU-Heimtierausweis.","Es ist ein EU-Heimtierausweis mitzuführen, in dem eine gültige Tollwutimpfung sowie eine individuelle Kennzeichnung (Chip) des Hundes eingetragen sind.","Eine individuelle Kennzeichnung (Chip) sowie eine wirksame Entwurmung. Da fast alle Länder tollwutfrei sind, ist eine Tollwutimpfung nicht mehr erforderlich."],"correct":[2],"multi":false,"source":"Buch","bookNumber":29,"explanation":"Richtig: Es ist ein EU-Heimtierausweis mitzuführen, in dem eine gültige Tollwutimpfung sowie eine individuelle Kennzeichnung (Chip) des Hundes eingetragen sind.."},{"id":"buch-030","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Können Hundewelpen bereits im Mutterbauch riechen?","answers":["Nein, schließlich haben sie Fruchtwasser in der Nase.","Nein, diese Sinnesleistung ist in diesem Alter noch nicht entwickelt.","Ja, sie riechen ein im Fruchtwasser enthaltenes Pheromon, das auch an der Gesäugeleiste produziert wird, deshalb finden sie mit geschlossenen Augen – anhand des bekannten Geruchs.","Ja, sie nehmen über die Nabelschnur die Geruchswahrnehmung der Mutter auf.","Nein, es gibt noch keine Nervenverbindung zwischen Nase und Gehirn des Welpen."],"correct":[2],"multi":false,"source":"Buch","bookNumber":30,"explanation":"Richtig: Ja, sie riechen ein im Fruchtwasser enthaltenes Pheromon, das auch an der Gesäugeleiste produziert wird, deshalb finden sie mit geschlossenen Augen – anhand des bekannten Geruchs.."},{"id":"buch-031","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Welche Aussage ist bezüglich der Entwicklungsphasen des Welpen falsch?","answers":["In der neonatalen Phase kann der Welpe noch nicht hören und sehen.","In der neonatalen Phase ist der Welpe zur vollständigen Wärmeregulation in der Lage.","Im Laufe der Übergangsphase kann der Welpe hören und sehen.","Erfahrungen in der Sozialisierungsphase stellen die Basis für das spätere Verhalten dar.","Die Entwicklungsphasen der Welpen werden genetisch gesteuert."],"correct":[1],"multi":false,"source":"Buch","bookNumber":31,"explanation":"Richtig: In der neonatalen Phase ist der Welpe zur vollständigen Wärmeregulation in der Lage.."},{"id":"buch-032","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Ab wann kann ein Welpe hören und sehen?","answers":["Ab der 3. Lebenswoche","Ab der 1. Lebenswoche","Ab der 5. Lebenswoche","Ab der Geburt","Ab der 7. Lebenswoche"],"correct":[0],"multi":false,"source":"Buch","bookNumber":32,"explanation":"Richtig: Ab der 3. Lebenswoche."},{"id":"buch-033","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"Von wann bis wann durchlebt der Hund die Sozialisationsphase, in der sich die Basis für das zukünftige Verhalten bildet?","answers":["Von der Geburt bis zum vollendeten ersten Lebensjahr","Von der Geburt bis zum Alter von sechs Monaten","Sie beginnt um den 21. Lebenstag herum und erstreckt sich bis zum Alter von 12 bis 14 Wochen","Sie beginnt nach der Pubertät","Sie beginnt nach der Abgabe des Welpen vom Züchter an den Besitzer"],"correct":[2],"multi":false,"source":"Buch","bookNumber":33,"explanation":"Richtig: Sie beginnt um den 21. Lebenstag herum und erstreckt sich bis zum Alter von 12 bis 14 Wochen."},{"id":"buch-034","topic":"welpen_entwicklung","topicName":"Welpen & Entwicklung","question":"In welcher Lebensphase verhalten sich Welpen auffallend angstfrei und lassen sich ganz entspannt an ungewohnte Situationen heranführen?","answers":["Zwischen der 3. und 5. Lebenswoche","Das geht immer","Das macht erst ab der 16. Lebenswoche Sinn","Hunde sollten keinen ungewohnten Situationen ausgesetzt werden.","Nach dem Füttern"],"correct":[0],"multi":false,"source":"Buch","bookNumber":34,"explanation":"Richtig: Zwischen der 3. und 5. Lebenswoche."},{"id":"buch-035","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Der neu angeschaffte Welpe will keine Treppen steigen. Was tun Sie?","answers":["Anfangs tragen Sie ihn. Wenn er sich eingelebt hat, können Sie anfangen, das Treppensteigen zu üben.","Sie ziehen den Hund einfach die Treppe hinauf und hinunter; so wird er es bald lernen.","Da Hunde keine Treppen steigen dürfen, wird er getragen.","Ein Hund muss bis zum 12. Lebensmonat die Treppe hochgetragen werden."],"correct":[0],"multi":false,"source":"Buch","bookNumber":35,"explanation":"Richtig: Anfangs tragen Sie ihn. Wenn er sich eingelebt hat, können Sie anfangen, das Treppensteigen zu üben.."},{"id":"buch-036","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Warum sind besonders die ersten drei Lebensmonate eines Hundes so entscheidend?","answers":["Die Hunde sammeln in dieser Zeit wichtige Erfahrungen, die ihnen im späteren Leben als Vergleichsmaßstab dienen.","In dieser Zeit entwickelt sich das Gehirn besonders langsam. Alle wichtigen Erfahrungen kann ein Hund auch zu einem späteren Zeitpunkt im Leben machen.","Durch viel Ruhe und wenige Reize von außen kann man die Verhaltensentwicklung fördern.","Die Welpen sollten in dieser Zeit bei der Mutterhündin bleiben, damit sie wichtige Verhaltensweisen von dieser lernen können."],"correct":[0],"multi":false,"source":"Buch","bookNumber":36,"explanation":"Richtig: Die Hunde sammeln in dieser Zeit wichtige Erfahrungen, die ihnen im späteren Leben als Vergleichsmaßstab dienen.."},{"id":"buch-037","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Der Welpe sollte am besten:","answers":["Möglichst wenig Kontakt zur Umwelt bekommen, weil er sonst verunsichert wird.","Viel Kontakt zu Menschen, Artgenossen und Umweltreizen haben, damit er später in allen Situationen gut zurecht kommt.","Überwiegend im Zwinger gehalten werden.","Möglichst wenig Kontakt zu fremden Menschen haben, weil er sich sonst bedroht fühlen könnte."],"correct":[1],"multi":false,"source":"Buch","bookNumber":37,"explanation":"Richtig: Viel Kontakt zu Menschen, Artgenossen und Umweltreizen haben, damit er später in allen Situationen gut zurecht kommt.."},{"id":"buch-038","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Wie viele Hund-Halter-Teams sollten in einer Welpengruppe maximal pro Trainer betreut werden?","answers":["10","2","6","12","Nur mit einem Hund"],"correct":[2],"multi":false,"source":"Buch","bookNumber":38,"explanation":"Eine überschaubare Gruppengröße ermöglicht eine sichere und individuelle Betreuung. Laut Buch sollen maximal 6 Hund-Halter-Teams pro Trainer betreut werden."},{"id":"buch-039","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Wie sollte eine Welpengruppe zusammengesetzt sein?","answers":["Am besten spielen dort Hunde derselben Rasse zusammen.","Verschiedene Rassen sind wichtig, weil der Welpe auf sein späteres Leben sozialisiert ist.","Das ist für den Lerneffekt vollkommen egal.","Hunde verschiedener Altersstufen sollten zusammen sein.","Mindestens ein Wurfgeschwister sollte dabei sein."],"correct":[1],"multi":false,"source":"Buch","bookNumber":39,"explanation":"Richtig: Verschiedene Rassen sind wichtig, weil der Welpe auf sein späteres Leben sozialisiert ist.."},{"id":"buch-040","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was gilt für die ersten 12 - 14 Lebenswochen eines Hundes?","answers":["Der Welpe wird gleich nach der Geburt auf den Menschen geprägt.","Der Hund kann nur in dieser Zeit wichtige Hörlaute wie „Sitz“ und „Platz“ erlernen.","Welpen können in dieser Zeit besonders gut soziale Fähigkeiten entwickeln.","In dieser Zeit reagieren Welpen besonders ängstlich auf Veränderungen."],"correct":[2],"multi":false,"source":"Buch","bookNumber":40,"explanation":"Richtig: Welpen können in dieser Zeit besonders gut soziale Fähigkeiten entwickeln.."},{"id":"buch-041","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Ab wann sollte man eine Welpengruppe besuchen?","answers":["So früh wie möglich. Schon ab der achten Woche, wenn die Zusammensetzung der Gruppe passt.","Erst ab dem fünften Lebensmonat.","Da langes oder raues Welpenspiel den Gelenken schadet, sollte man dies gar nicht machen.","Gar nicht. Es genügt, wenn der Welpe Kontakt zu einem anderen Hund hat, weil dieser Kontakt dem Hund für eine optimale Entwicklung reicht."],"correct":[0],"multi":false,"source":"Buch","bookNumber":41,"explanation":"Richtig: So früh wie möglich. Schon ab der achten Woche, wenn die Zusammensetzung der Gruppe passt.."},{"id":"buch-042","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Welche der hier angegebenen Kriterien machen einen guten Welpenspielkurs aus?","answers":["Hunde jeden Alters dürfen teilnehmen.","Das Alter der Hunde liegt zwischen 6 und 12 Monaten.","Die Gruppengröße beträgt maximal 6 bis 8 Hunde pro Betreuungsperson.","Es wird ausschließlich gespielt."],"correct":[2],"multi":false,"source":"Buch","bookNumber":42,"explanation":"Richtig: Die Gruppengröße beträgt maximal 6 bis 8 Hunde pro Betreuungsperson.."},{"id":"buch-043","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Wie bringt man seinem Hund eine zuverlässige Beißhemmung bei?","answers":["Das muss man gar nicht, sie ist angeboren.","Man zeigt dem Hund, dass er der Schwächere ist.","Man bricht das Spiel sofort mit einem empörten „Au“ ab.","Man gibt ihm ein Leckerchen.","Man zieht an der Leine."],"correct":[2],"multi":false,"source":"Buch","bookNumber":43,"explanation":"Richtig: Man bricht das Spiel sofort mit einem empörten „Au“ ab.."},{"id":"buch-044","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Wie kann einem Welpen die Beißhemmung gegenüber Menschen antrainieren?","answers":["Die Beißhemmung kann nicht beeinflusst werden, da sie genetisch fixiert ist.","Wenn der Welpe zubeißt, wird der Kontakt unverzüglich unterbrochen.","Dem Hund wird mit Worten erklärt, dass sein Verhalten falsch ist.","Beißt der Hund im Spiel zu, wird er zur Strafe auf den Rücken gedreht."],"correct":[1],"multi":false,"source":"Buch","bookNumber":44,"explanation":"Richtig: Wenn der Welpe zubeißt, wird der Kontakt unverzüglich unterbrochen.."},{"id":"buch-045","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was sind Kennzeichen von Spiel?","answers":["Die Spielpartner wechseln des Öfteren ihre Rollen (z.B. vom Wegrennenden zum Hinterherrennenden).","Das Spiel findet in gespannter Umgebung statt.","Es wird immer das Gleiche gemacht, wie z.B. das Werfen und Zurückbringen beim Spiel mit dem Ball.","Beim Spielen wird nie geknurrt."],"correct":[0],"multi":false,"source":"Buch","bookNumber":45,"explanation":"Richtig: Die Spielpartner wechseln des Öfteren ihre Rollen (z.B. vom Wegrennenden zum Hinterherrennenden).."},{"id":"buch-046","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Ihr Hund begegnet freilaufend einem anderen freilaufenden Hund, der seinen Schwanz einklemmt und Blickkontakt zu Ihrem Hund vermeidet. Welche der Aussagen trifft auf dieses Verhalten zu?","answers":["Der andere Hund zeigt sich Ihrem Hund gegenüber unterwürfig.","Ihr Hund hat den anderen Hund gerade zum Spiel aufgefordert.","Ihr Hund ist sehr dominant.","Es hat keine Bedeutung."],"correct":[0],"multi":false,"source":"Buch","bookNumber":46,"explanation":"Richtig: Der andere Hund zeigt sich Ihrem Hund gegenüber unterwürfig.."},{"id":"buch-047","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Körpersprache spielt bei der Kommunikation der Hunde eine entscheidende Rolle, welche charakteristische Körperhaltung zeigt das Imponierverhalten?","answers":["Eingeknickte Vorderbeine, Hinterbeine steil aufgestellt.","Körperhaltung geduckt, Ohren angelegt.","Steife Körperhaltung, aufgerichteter Körper, Blickkontakt.","Auf dem Rücken liegen, Blickkontakt meiden."],"correct":[2],"multi":false,"source":"Buch","bookNumber":47,"explanation":"Richtig: Steife Körperhaltung, aufgerichteter Körper, Blickkontakt.."},{"id":"buch-048","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was bedeutet es, wenn ein Hund einem anderen den Kopf auf den Rücken legt?","answers":["Er ist unterwürfig.","Er macht eine Spielaufforderung.","Er ist müde.","Es ist eine Imponiergeste."],"correct":[3],"multi":false,"source":"Buch","bookNumber":48,"explanation":"Richtig: Es ist eine Imponiergeste.."},{"id":"buch-049","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Ist ein Hund, der mit seiner Rute wedelt, generell freundlich gestimmt?","answers":["Ja, das Wedeln der Rute ist bei Hunden Ausdruck von freundlicher Befindlichkeit.","Nein, das Wedeln der Rute sagt bei Hunden nichts über deren Befindlichkeit aus.","Nein, Hunde wedeln auch mit der Rute, wenn ihnen kalt ist.","Nein, der Hund kann einfach nur erregt sein."],"correct":[3],"multi":false,"source":"Buch","bookNumber":49,"explanation":"Richtig: Nein, der Hund kann einfach nur erregt sein.."},{"id":"buch-050","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Woran kann man erkennen, dass ein Hund unter Stress steht?","answers":["Hecheln kann auf Stress hindeuten.","Betteln nach Futter kann auf Stress hindeuten.","Aufforderung zum Spiel kann auf Stress hindeuten.","Stress ist eine menschliche Erscheinung. Hunde kennen keinen Stress."],"correct":[0],"multi":false,"source":"Buch","bookNumber":50,"explanation":"Richtig: Hecheln kann auf Stress hindeuten.."},{"id":"buch-051","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was bedeutet es, wenn sich zwei Hunde direkt in die Augen starren?","answers":["Es bedeutet, dass sie sich gern haben.","Es ist eine Beschwichtigungsgeste.","Auf diese Weise bedrohen sie sich gegenseitig.","Sie wollen miteinander spielen."],"correct":[2],"multi":false,"source":"Buch","bookNumber":51,"explanation":"Richtig: Auf diese Weise bedrohen sie sich gegenseitig.."},{"id":"buch-052","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was für eine Bedeutung hat es, wenn sich ein Hund flach auf den Boden legt und einen entgegenkommenden Hund mit dem Blick fixiert?","answers":["Er möchte vermutlich einen „Angriff“ starten. Dieser Angriff kann spielerisch oder ernst ausgerichtet sein.","Er ist müde und möchte sich schnell noch ein wenig ausruhen, bis der andere Hund da ist.","Es hat gar nichts mit dem anderen Hund zu tun, sondern ist ein Zeichen von starken Bauchschmerzen.","Der liegende Hund verhält sich unterwürfig."],"correct":[0],"multi":false,"source":"Buch","bookNumber":52,"explanation":"Richtig: Er möchte vermutlich einen „Angriff“ starten. Dieser Angriff kann spielerisch oder ernst ausgerichtet sein.."},{"id":"buch-053","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was versteht man unter Habituation?","answers":["Der Hund gewöhnt sich an Reize, die ihm zuvor Angst machten.","Der Hund reagiert empfindlicher auf bestimmte Reize.","Der Hund ignoriert zunehmend Reize, die zuvor neutral besetzt waren.","Der Hund gewöhnt sich an seinen Besitzer.","Der Hund gewöhnt sich an die neue häusliche Umgebung."],"correct":[2],"multi":false,"source":"Buch","bookNumber":53,"explanation":"Richtig: Der Hund ignoriert zunehmend Reize, die zuvor neutral besetzt waren.."},{"id":"buch-054","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was versteht man unter Sensibilisierung?","answers":["Der Hund lernt, bestimmte Reize zu ignorieren.","Der Hund zeigt eine verstärkte Reaktion auf einen bestimmten Reiz.","Der Hund wird immer nervöser.","Der Hund wird einfühlsam.","Der Hund wird ängstlicher."],"correct":[1],"multi":false,"source":"Buch","bookNumber":54,"explanation":"Richtig: Der Hund zeigt eine verstärkte Reaktion auf einen bestimmten Reiz.."},{"id":"buch-055","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was versteht man unter Assoziativem Lernen?","answers":["Der Hund verknüpft zwei Ereignisse, die nacheinander stattfinden.","Der Hund verknüpft zwei Ereignisse miteinander, die fast zeitgleich stattfinden.","Der Hund verknüpft zwei Ereignisse, zwischen denen mehrere Tage liegen.","Der Hund erinnert sich an Erlebnisse aus dem Welpenalter.","Der Hund kann die Kommandos seines Halters vorhersehen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":55,"explanation":"Richtig: Der Hund verknüpft zwei Ereignisse miteinander, die fast zeitgleich stattfinden.."},{"id":"buch-056","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was versteht man unter operanter bzw. instrumenteller Konditionierung?","answers":["Der Hund entscheidet sich von selbst, eine bestimmte Verhaltensweise zu zeigen und erhält dafür eine Reaktion aus der Umwelt. Diese Verknüpfung wirkt sich auf sein zukünftiges Verhalten aus.","Der Hund zeigt auf ein bestimmtes Signal hin eine bestimmte Verhaltensweise.","Der Hund wird mithilfe eines Leckerchens dazu motiviert, eine bestimmte Verhaltensweise zu zeigen.","Der Halter bewirkt durch Spielen eines Instruments die gewünschte Reaktion beim Hund."],"correct":[0],"multi":false,"source":"Buch","bookNumber":56,"explanation":"Richtig: Der Hund entscheidet sich von selbst, eine bestimmte Verhaltensweise zu zeigen und erhält dafür eine Reaktion aus der Umwelt. Diese Verknüpfung wirkt sich auf sein zukünftiges Verhalten aus.."},{"id":"buch-057","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Wie lernen Hunde am besten?","answers":["Durch negative Belohnung und positive Strafe.","Durch unregelmäßiges Training.","Durch positive Belohnung und positive Strafe.","Nach dem Fressen.","Durch positive Belohnung und negative Strafe."],"correct":[4],"multi":false,"source":"Buch","bookNumber":57,"explanation":"Richtig: Durch positive Belohnung und negative Strafe.."},{"id":"buch-058","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Spricht man bei Hunden von Trieben oder von Motivationen?","answers":["Von Trieben.","Von Motivationen, die Bezeichnung Trieb ist veraltet.","Es gibt beides.","Weder noch.","Man spricht von triebgesteuerter Motivation."],"correct":[1],"multi":false,"source":"Buch","bookNumber":58,"explanation":"Richtig: Von Motivationen, die Bezeichnung Trieb ist veraltet.."},{"id":"buch-059","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was versteht man unter einer Motivation?","answers":["Die deutliche Bereitschaft des Hundes, zu gehorchen.","Einen Erregungszustand, der den Hund veranlasst, nach einem bestimmten Objekt oder Ziel zu streben, zum Beispiel: Beute machen, jagen oder spielen.","Die Entscheidung, eigene Wege zu gehen.","Leckerchen geben.","Seinem Trieb zu folgen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":59,"explanation":"Richtig: Einen Erregungszustand, der den Hund veranlasst, nach einem bestimmten Objekt oder Ziel zu streben, zum Beispiel: Beute machen, jagen oder spielen.."},{"id":"buch-060","topic":"koerpersprache_kommunikation","topicName":"Körpersprache & Kommunikation","question":"Was versteht man unter positiven Verstärkern?","answers":["Sie erhöhen die Motivation, etwas zu tun und somit die Lernbereitschaft. Positive Verstärker können beispielsweise Leckerchen oder Spielzeuge sein.","Sie helfen, den Hund zu unterdrücken.","Diese braucht man nur für ungehorsame Hunde.","Sie erhöhen die Lautstärke der Rufkommandos.","Sie helfen dem Hund, lauter zu bellen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":60,"explanation":"Richtig: Sie erhöhen die Motivation, etwas zu tun und somit die Lernbereitschaft. Positive Verstärker können beispielsweise Leckerchen oder Spielzeuge sein.."},{"id":"buch-061","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was versteht man unter Sozialisations- und Habituationsphase (sensible Phase)?","answers":["Die Tageszeiten, in denen der Hund besonders sensibel ist, z. B. morgens.","Die Zeitspanne, in der Hunde kritisch reagieren können, z. B. beim Fressen oder wenn man sie aufweckt.","Die Zeit zwischen 3. und 14. Lebenswoche, hier ist der Hund ganz besonders aufnahme- und lernfähig.","Die Phase bis zum Öffnen der Augen. Mit sensibler Phase ist die besondere Sensibilität der Haut durch Berührung in dieser Zeit gemeint."],"correct":[2],"multi":false,"source":"Buch","bookNumber":61,"explanation":"Die sensible Phase liegt ungefähr zwischen der 3. und 14. Lebenswoche. In dieser Zeit verarbeitet der Welpe Erfahrungen mit Menschen, Artgenossen und seiner Umwelt besonders intensiv. Positive und angemessen dosierte Erfahrungen können deshalb die weitere Verhaltensentwicklung wesentlich beeinflussen."},{"id":"buch-062","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was ist die Voraussetzung für erfolgreiches Lernen?","answers":["Viele Trainingseinheiten, mindestens jedoch 20 Minuten am Stück","Rennen und Herumtollen.","Ausgiebiger Schlaf.","Abspeicherung von Informationen im Gedächtnis."],"correct":[3],"multi":false,"source":"Buch","bookNumber":62,"explanation":"Richtig: Abspeicherung von Informationen im Gedächtnis.."},{"id":"buch-063","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Welche Aussage trifft auf Einzel- oder Gruppenstunden einer guten Hundeschule zu?","answers":["Die Gruppengröße umfasst mindestens 12 Hunde, ihre Halter und einen Trainer.","Der Trainer wirkt entspannt und souverän.","In einer Übungsstunde wird immer nur ein Kommando geübt und es wird immer nur an einem bestimmten Ort trainiert.","Es wird ausschließlich mit einer Rasse trainiert, z.B. Mops."],"correct":[1],"multi":false,"source":"Buch","bookNumber":63,"explanation":"Richtig: Der Trainer wirkt entspannt und souverän.."},{"id":"buch-064","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Auf was muss man beim Einsatz von Belohnungen achten?","answers":["Der Hund sollte mindestens zwei Minuten lang das erwünschte Verhalten gezeigt haben, bevor er belohnt wird.","Spielen mit dem Hund eignet sich nicht als Belohnung, da der Hund das Training dann nicht ernst nimmt.","Das Belohnen mit Leckerli sollte vermieden werden, denn sie verleiten den Hund nur zum Betteln.","Der Hund sollte anfangs immer, später nur noch unregelmäßig belohnt werden."],"correct":[3],"multi":false,"source":"Buch","bookNumber":64,"explanation":"Richtig: Der Hund sollte anfangs immer, später nur noch unregelmäßig belohnt werden.."},{"id":"buch-065","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was passiert, wenn man ein bestimmtes Verhalten mit Futter belohnt?","answers":["Der Hund wird dieses Verhalten in Zukunft häufiger zeigen.","Der Hund zeigt dieses Verhalten nur noch, wenn er sieht, dass man Futter dabei hat.","Der Hund sollte aus Treue zum Besitzer brav sein und nicht, weil er mit Futter bestochen wird.","Der Besitzer wird als Rudelführer nicht mehr ernst genommen, weil der Hund weiß, dass er beim Besitzer Futter erbetteln kann."],"correct":[0],"multi":false,"source":"Buch","bookNumber":65,"explanation":"Richtig: Der Hund wird dieses Verhalten in Zukunft häufiger zeigen.."},{"id":"buch-066","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was ist geeignet, um den Welpen möglichst früh stubenrein zu bekommen?","answers":["Wenig zu essen und zu trinken geben.","Den Welpen nach dem Schlafen, Spielen und Fressen möglichst direkt nach draußen bringen.","Ihn mit der Nase in das ‚Malheur‘ hineinstupsen.","Laut schimpfen, wenn es passiert ist.","Eine aufgeblasene Papiertüte knallen lassen; dann erschrickt er nachhaltig."],"correct":[1],"multi":false,"source":"Buch","bookNumber":66,"explanation":"Richtig: Den Welpen nach dem Schlafen, Spielen und Fressen möglichst direkt nach draußen bringen.."},{"id":"buch-067","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Wie viele Trainingseinheiten pro Tag bringen bei der Basiserziehung den besten Erfolg?","answers":["Eine lange Trainingseinheit.","Nur eine Trainingseinheit direkt nach dem Füttern.","Mehrere kurze Trainingseinheiten über den Tag verteilt.","Training ist nur einmal pro Woche nötig."],"correct":[2],"multi":false,"source":"Buch","bookNumber":67,"explanation":"Richtig: Mehrere kurze Trainingseinheiten über den Tag verteilt.."},{"id":"buch-068","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"In welcher Reihenfolge steigert man beim Lernen die Anforderungen?","answers":["Zuerst Ablenkung, dann Distanz und zuletzt Dauer.","Immer alle Anforderungen gleichzeitig.","Zuerst möglichst große Distanz, danach Ablenkung.","Dauer, Distanz und Ablenkung werden schrittweise gesteigert."],"correct":[3],"multi":false,"source":"Buch","bookNumber":68,"explanation":"Richtig: Dauer, Distanz und Ablenkung werden schrittweise gesteigert."},{"id":"buch-069","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Wie oft sollte der Halter ein Hörzeichen geben?","answers":["So oft, bis der Hund reagiert.","Einmal, damit der Hund lernt, auf das Hörzeichen zuverlässig zu reagieren.","Dreimal, weil man nur so die Aufmerksamkeit des Hundes gewinnen kann.","Bis zu zehnmal, durch die Wiederholung kann sich der Hund das Hörzeichen besser einprägen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":69,"explanation":"Richtig: Einmal, damit der Hund lernt, auf das Hörzeichen zuverlässig zu reagieren.."},{"id":"buch-070","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was versteht man unter einem Fehler-Wort?","answers":["Das ist ein bestimmtes Wort, das den Hund – in jeder erdenklichen Situation – zuverlässig von unerwünschtem Verhalten abhält.","Das ist ein falsch eingesetztes Hörzeichen.","Das ist ein Wort, das den Hund in seinem Verhalten bestärkt.","Das ist ein Hörzeichen, das der Hund nicht versteht.","Das ist ein falsch ausgesprochenes Hörzeichen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":70,"explanation":"Richtig: Das ist ein bestimmtes Wort, das den Hund – in jeder erdenklichen Situation – zuverlässig von unerwünschtem Verhalten abhält.."},{"id":"buch-071","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was versteht man unter einem Lob-Wort?","answers":["Das ist ein Wort, das dem Hund sofort das Gefühl vermittelt, etwas richtig gemacht zu haben.","Das ist ein Wort, das man immer wieder zwischendurch einsetzen kann, um dem Hund zu zeigen, dass man ihn mag.","Damit lenkt man den Hund ab, wenn er unerwünschtes Verhalten zeigt.","Mit einem Lob-Wort tröstet man den Hund, wenn er Kummer hat.","Ein Hörzeichen, mit dem der Hund gerufen wird."],"correct":[0],"multi":false,"source":"Buch","bookNumber":71,"explanation":"Richtig: Das ist ein Wort, das dem Hund sofort das Gefühl vermittelt, etwas richtig gemacht zu haben.."},{"id":"buch-072","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Wie kann man einen Hund loben?","answers":["Man kocht ihm nach einer Übung sein Lieblingsessen.","Lob ist nicht erforderlich, der Hund weiß, dass er die Aufgabe gelöst hat.","Man lässt ihn stromern gehen.","Man gibt ihm Sozialkontakt, Streicheleinheiten oder spielt mit ihm."],"correct":[3],"multi":false,"source":"Buch","bookNumber":72,"explanation":"Richtig: Man gibt ihm Sozialkontakt, Streicheleinheiten oder spielt mit ihm.."},{"id":"buch-073","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Wann beginnt die Erziehung eines Hundes?","answers":["Ab dem vollendeten ersten Lebensjahr.","Ab dem sechsten Lebensmonat.","Direkt bei der Übernahme des Tieres.","Eine besondere Erziehung ist nicht nötig."],"correct":[2],"multi":false,"source":"Buch","bookNumber":73,"explanation":"Richtig: Direkt bei der Übernahme des Tieres.."},{"id":"buch-074","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Welche Maßnahmen zur Erziehung sind sinnvoll?","answers":["Auf-den-Rücken-Drehen und Festhalten im Nacken.","Nackenfell-Schütteln.","Nichtbeachten des Hundes, wenn die Situation es zulässt.","Hartes Rucken an der Leine."],"correct":[2],"multi":false,"source":"Buch","bookNumber":74,"explanation":"Richtig: Nichtbeachten des Hundes, wenn die Situation es zulässt.."},{"id":"buch-075","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Welche Aussage ist in Bezug auf Hundeerziehung richtig?","answers":["Hunde müssen nicht erzogen werden.","Durch das Vorgeben von Regeln und Grenzen können Hunde lernen, sich richtig zu verhalten.","Es ist sinnlos Hunde zu bestrafen, weil sie instinktiv handeln und ihr Verhalten nicht steuern können.","Hunde reagieren nur auf Gesten von Menschen, deshalb sind Emotionen unnötig."],"correct":[1],"multi":false,"source":"Buch","bookNumber":75,"explanation":"Richtig: Durch das Vorgeben von Regeln und Grenzen können Hunde lernen, sich richtig zu verhalten.."},{"id":"buch-076","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was passiert, wenn ein Hund als Erziehungsmaßnahme häufig und hart bestraft wird?","answers":["Er wird die Übung schnell und zuverlässig ausführen, denn so lernt er, dass er brav sein muss.","Erziehung über Strafen ist besser als mit Leckerlies, da der Hund sonst verweichlicht.","Hunde verhalten sich untereinander auch grob und aggressiv, deshalb verstehen sie das am besten.","Der Hund könnte aggressiv reagieren, weil er sich bedroht fühlt."],"correct":[3],"multi":false,"source":"Buch","bookNumber":76,"explanation":"Richtig: Der Hund könnte aggressiv reagieren, weil er sich bedroht fühlt.."},{"id":"buch-077","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Welche Aussage trifft für den Einsatz von Elektroreizgeräten in der Hundeerziehung zu?","answers":["Es ist eine einfache und schnelle Methode, die sehr erfolgreich in der Erziehung eingesetzt werden kann.","Es können Fehlverknüpfungen und Angstverhalten daraus resultieren. Der Einsatz von Elektroreizgeräten, die erhebliche Leiden oder Schmerzen verursachen können, ist bei der Hundeausbildung nach geltendem Tierschutzrecht verboten.","Der Hund weiß dadurch, dass er nicht machen kann, was er will.","Die meisten Hunde reagieren gar nicht auf den Stromimpuls."],"correct":[1],"multi":false,"source":"Buch","bookNumber":77,"explanation":"Richtig: Es können Fehlverknüpfungen und Angstverhalten daraus resultieren. Der Einsatz von Elektroreizgeräten, die erhebliche Leiden oder Schmerzen verursachen können, ist bei der Hundeausbildung nach geltendem Tierschutzrecht verboten.."},{"id":"buch-078","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was sollte man im Umgang mit dem Hund beherzigen?","answers":["Gleichberechtigung und liebevollen Umgang","Geduld, Lob und Konsequenz","Unnachgiebige Härte","Laute Kommandos"],"correct":[1],"multi":false,"source":"Buch","bookNumber":78,"explanation":"Richtig: Geduld, Lob und Konsequenz."},{"id":"buch-079","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Warum ist es ratsam, dem Hund so früh wie möglich abzugewöhnen, an Menschen hochzuspringen?","answers":["Durch das Anspringen können Hunde Menschen erschrecken und/oder verletzen.","Kleinen Hunden braucht man das Anspringen nicht abgewöhnen, da sie weder Kleidung zerreißen noch jemanden erschrecken.","Als ein Zeichen großer Freude, das nichts mit Aggressivität zu tun hat, muss man dem Hund das Anspringen nicht abgewöhnen. Es ist eine freundliche Geste.","Da der Hund nur freundlich Kontakt aufnehmen will, ist es ein Zeichen der Fürsorge, dies zuzulassen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":79,"explanation":"Richtig: Durch das Anspringen können Hunde Menschen erschrecken und/oder verletzen.."},{"id":"buch-080","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Was sollte man beachten, die Stubenreinheit des Hundes zu trainieren?","answers":["Nach dem Fressen, Trinken, Spielen, Schlafen geht man mit ihm an einen ruhigen Ort raus.","Wenn er in die Wohnung pinkelt, wird er am Nackenfell geschüttelt.","Er wird mit seiner Nase in den Urin gestupst, damit er lernt, dass er das nicht darf!","Das Trinkwasser wird rationiert, sodass der Hund nicht soviel trinkt."],"correct":[0],"multi":false,"source":"Buch","bookNumber":80,"explanation":"Richtig: Nach dem Fressen, Trinken, Spielen, Schlafen geht man mit ihm an einen ruhigen Ort raus.."},{"id":"buch-081","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Wie oft und wie lange sollte man mit einem Hund trainieren?","answers":["Mindestens einmal am Tag eine Stunde lang.","So häufig wie möglich, aber immer nur kurz, damit sich der Hund gut konzentrieren kann.","Es ist wichtig, dass man immer zur selben Zeit übt und zwar so lange, wie der Hund sich konzentrieren kann.","Damit der Hund nicht überfordert wird, sind zwei kurze Übungen auf jedem Spaziergang absolut ausreichend."],"correct":[1],"multi":false,"source":"Buch","bookNumber":81,"explanation":"Richtig: So häufig wie möglich, aber immer nur kurz, damit sich der Hund gut konzentrieren kann.."},{"id":"buch-082","topic":"erziehung_lernverhalten","topicName":"Erziehung & Lernverhalten","question":"Sie entdecken den leer geräumten Küchenmülleimer und sind wirklich sauer. Haben Hunde ein schlechtes Gewissen?","answers":["Das kommt auf die Erziehung des Hundes an.","Nein, sie reagieren auf die Körpersprache ihrer aufgebrachten Menschen.","Ja, denn Hunde können zwischen Gut und Böse unterscheiden.","Das kommt ganz auf die Hunderasse an."],"correct":[1],"multi":false,"source":"Buch","bookNumber":82,"explanation":"Richtig: Nein, sie reagieren auf die Körpersprache ihrer aufgebrachten Menschen.."},{"id":"buch-083","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Wie entstehen beim Hund Vertrauen und Bindung zum Menschen?","answers":["Indem man dem Hund mit aller Härte zeigt, wer der Stärkere ist.","Indem man immer lieb und freundlich zum Hund ist.","Durch nachvollziehbare und konsequente Erziehung.","Indem man ihn regelmäßig füttert.","Durch regelmäßige Spaziergänge."],"correct":[2],"multi":false,"source":"Buch","bookNumber":83,"explanation":"Richtig: Durch nachvollziehbare und konsequente Erziehung.."},{"id":"buch-084","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Wie kann man eine gute Bindung zwischen Hund und Mensch fördern?","answers":["Der Hund darf stets freilaufen.","Durch regelmäßige Sozialkontakte, konsequente Führung und Spiel.","Durch die Einhaltung eines geregelten Lebens.","Nur indem man mit dem Hund viel spielt."],"correct":[1],"multi":false,"source":"Buch","bookNumber":84,"explanation":"Richtig: Durch regelmäßige Sozialkontakte, konsequente Führung und Spiel.."},{"id":"buch-085","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Was sollte in Haushalten mit Hund und Krabbelkindern beachtet werden?","answers":["Nichts. Der Hund wird das Kind bedingungslos akzeptieren.","Der Hund sollte auf jeden Fall Rückzugsmöglichkeiten haben, wohin das Krabbelkind nicht folgen kann.","Das kommt ganz auf den Hund an.","Der Hund sollte im Bett des Kindes schlafen.","Hund und Kind sollten regelmäßig zusammen alleine gelassen werden."],"correct":[1],"multi":false,"source":"Buch","bookNumber":85,"explanation":"Richtig: Der Hund sollte auf jeden Fall Rückzugsmöglichkeiten haben, wohin das Krabbelkind nicht folgen kann.."},{"id":"buch-086","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Was kann zu Problemen führen, wenn Kinder Hunden begegnen?","answers":["Wenn die Kinder dem Hund direkt in die Augen starren.","Kinder bewegen sich langsam und besonnen, somit haben auch ängstliche Hunde keine Furcht.","Wenn Kinder ruhige und bestimmte Gesten oder Sichtzeichen einsetzen.","Wenn Kinder warten, dass der Hund von sich aus Kontakt sucht und sie dann zunächst die Hand beschnüffeln lassen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":86,"explanation":"Richtig: Wenn die Kinder dem Hund direkt in die Augen starren.."},{"id":"buch-087","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Ihr Kleinkind krabbelt auf Ihren schlafenden Hund zu. Wie schätzen Sie die Situation ein?","answers":["Der Hund kennt das Kind, er wird ihm ganz sicher nichts tun.","Der Mensch ist immer höher in der Rangordnung innerhalb des Rudels. Der Hund wird das akzeptieren und dem Kind nichts tun.","Ein Kleinkind ist in seinen Handlungen schwer berechenbar. Es wäre besser, das Kind aus der Nähe des Hundeplatzes wegzubringen.","Der Hund kennt das Kind, wenn er erwacht, kann er entscheiden, ob er aufsteht und weggeht."],"correct":[2],"multi":false,"source":"Buch","bookNumber":87,"explanation":"Richtig: Ein Kleinkind ist in seinen Handlungen schwer berechenbar. Es wäre besser, das Kind aus der Nähe des Hundeplatzes wegzubringen.."},{"id":"buch-088","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Sollte ein Kind von 7 Jahren dem Familienhund das Futter geben?","answers":["Nie, denn die Fütterung eines Tieres ist immer die Pflicht der Erwachsenen.","Da beide immer Freunde bleiben sollen, kann das Kind dem Hund jederzeit Futter oder Leckerchen geben.","Ja, wenn es versteht, welche tägliche Futtermenge das Tier benötigt auch ohne Aufsicht.","Ja, wenn das Kind dem Hund unter Aufsicht den Napf hinstellt und der Hund erst auf Kommando herangeht."],"correct":[3],"multi":false,"source":"Buch","bookNumber":88,"explanation":"Richtig: Ja, wenn das Kind dem Hund unter Aufsicht den Napf hinstellt und der Hund erst auf Kommando herangeht.."},{"id":"buch-089","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Was kann zu Problemen zwischen Hunden und Kindern führen?","answers":["Kinder können auf Spielideen kommen, die Hunden unangenehm sind.","Kinder deuten Hundeverhalten instinktiv richtig und verhalten sich aus Hundesicht angemessen.","Zwischen Kindern und Hunden gibt es keine Probleme, denn sie sind gleichermaßen spielbegeistert und verstehen sich immer gut.","Hunde wissen, dass sie mit einem Kind vorsichtig sein müssen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":89,"explanation":"Richtig: Kinder können auf Spielideen kommen, die Hunden unangenehm sind.."},{"id":"buch-090","topic":"hund_oeffentlichkeit","topicName":"Hund & Öffentlichkeit","question":"Ihr zehnjähriges Kind hat Freunde eingeladen, sie wollen mit Ihrem Hund, der durchaus folgsam ist, gemeinsam spazieren gehen. Erlauben Sie es?","answers":["In Begleitung eines Erwachsenen.","Da der Hund gut folgt, dürfen die Kinder alleine gehen.","Nur wenn das Kind schon öfter alleine mit dem Hund unterwegs war.","Nein, Kinder dürfen grundsätzlich nicht mit Hunden spazieren gehen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":90,"explanation":"Richtig: In Begleitung eines Erwachsenen.."},{"id":"buch-091","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Wie sollte man sich einem ängstlichen Hund gegenüber verhalten?","answers":["Man sollte ihn bedrängen, damit er merkt, dass nichts passiert.","Man sollte ruhig bleiben, Abstand halten und ihm Zeit lassen.","Man sollte ihn laut ansprechen.","Man sollte ihn festhalten, damit er nicht fliehen kann."],"correct":[1],"multi":false,"source":"Buch","bookNumber":91,"explanation":"Richtig: Man sollte ruhig bleiben, Abstand halten und ihm Zeit lassen.."},{"id":"buch-092","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Wie kann man einem ängstlichen Hund helfen?","answers":["Er wird für seine Angst gelobt.","Man zwingt ihn an den angstauslösenden Gegenstand.","Man vermeidet jede weitere Begegnung für immer.","Man führt ihn schrittweise und positiv an den auslösenden Reiz heran."],"correct":[3],"multi":false,"source":"Buch","bookNumber":92,"explanation":"Richtig: Man führt ihn schrittweise und positiv an den auslösenden Reiz heran."},{"id":"buch-093","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Wie sollte man reagieren, wenn ein Hund sich vor einem Gegenstand fürchtet?","answers":["Man sollte den Hund für seine Angst belohnen.","Man sollte den Hund für seine Angst bestrafen.","Man sollte die Angst des Hundes in diesem Augenblick ignorieren und weitergehen.","Man geht am besten näher mit ihm heran und hält die Nase an den Gegenstand, bis er sich nicht mehr fürchtet."],"correct":[2],"multi":false,"source":"Buch","bookNumber":93,"explanation":"Richtig: Man sollte die Angst des Hundes in diesem Augenblick ignorieren und weitergehen.."},{"id":"buch-094","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Welche der folgenden Aussagen trifft zu?","answers":["Hunde, die Angst haben, können zubeißen.","Wenn ein angeleinter Hund ausweichen kann, beißt er nicht zu.","Hunde, die Angst haben, beißen nicht.","Man kann einen ängstlichen Hund immer anfassen, wenn man es behutsam macht."],"correct":[0],"multi":false,"source":"Buch","bookNumber":94,"explanation":"Richtig: Hunde, die Angst haben, können zubeißen.."},{"id":"buch-095","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Sollte man ängstlichen Hunden einen Maulkorb aufziehen, wenn es die Situation erfordern würde?","answers":["Nein, auf keinen Fall; der Hund würde hierdurch noch mehr Angst bekommen.","Ja, wenn man den Hund schrittweise daran gewöhnt, stellt der Maulkorb keine Belastung dar.","Nein, denn ein ängstlicher Hund ist nicht aggressiv.","Nein, denn es gibt bei einem ängstlichen Hund keine Situation, die einen Maulkorb erforderlich macht."],"correct":[1],"multi":false,"source":"Buch","bookNumber":95,"explanation":"Richtig: Ja, wenn man den Hund schrittweise daran gewöhnt, stellt der Maulkorb keine Belastung dar.."},{"id":"buch-096","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Kennzeichen von Angst bei einem Hund sind ...","answers":["die hoch aufgerichtete Rute.","aufmerksam nach vorne gerichtete Ohren.","Vermeidung des Blickkontaktes.","eine entspannte Körperhaltung."],"correct":[2],"multi":false,"source":"Buch","bookNumber":96,"explanation":"Richtig: Vermeidung des Blickkontaktes.."},{"id":"buch-097","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Nennen Sie typische Signale, an denen man ängstlich-unterwürfiges Verhalten erkennen kann.","answers":["Blickkontakt halten.","Sich klein machen und ducken.","Ohren aufstellen und wedeln.","Zum Spielen auffordern."],"correct":[1],"multi":false,"source":"Buch","bookNumber":97,"explanation":"Richtig: Sich klein machen und ducken.."},{"id":"buch-098","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Macht die Fütterung mit rohem, blutigem Fleisch einen Hund aggressiv?","answers":["Ja, wenn die Hunde einmal Blut geschmeckt haben, wollen sie es immer wieder haben.","Nein, der Geschmack des Fressens hat nichts mit der Aggressionsbereitschaft zu tun.","Ja, denn der Eiweißgehalt im Futter ist sehr hoch.","Nein, weil der Hund zufrieden ist, wenn er rohes, blutiges Fleisch gefressen hat und dann keinen Grund mehr zu aggressivem Verhalten hat."],"correct":[1],"multi":false,"source":"Buch","bookNumber":98,"explanation":"Richtig: Nein, der Geschmack des Fressens hat nichts mit der Aggressionsbereitschaft zu tun.."},{"id":"buch-099","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Warum reagieren viele Hunde an der Leine aggressiver?","answers":["Sie fühlen sich an der Leine mutiger.","Hunde können sich dann nicht frei bewegen. Sie können nicht ausweichen und fühlen sich schneller bedroht.","Hunde sehen in der Leine eine Ressource.","Hunde ärgern sich über die Leine und übertragen ihre Wut auf den anderen Hund."],"correct":[1],"multi":false,"source":"Buch","bookNumber":99,"explanation":"Richtig: Hunde können sich dann nicht frei bewegen. Sie können nicht ausweichen und fühlen sich schneller bedroht.."},{"id":"buch-100","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Was kann bei einem Hund zu verstärkter Aggression führen?","answers":["Die Fütterung von Getreide.","Unbewusste Bestätigung durch den Halter, wie z.B. das beruhigende Zureden oder Streicheln des pöbelnden Hundes durch den Halter.","Die Fütterung mit rohem Fleisch.","Eine häufige Ursache sind Raufspiele."],"correct":[1],"multi":false,"source":"Buch","bookNumber":100,"explanation":"Richtig: Unbewusste Bestätigung durch den Halter, wie z.B. das beruhigende Zureden oder Streicheln des pöbelnden Hundes durch den Halter.."},{"id":"buch-101","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Ist es ein Zeichen von Aggression, wenn ein Hund auf dem Spaziergang zu einer fremden Person hinrennt und diese unvermittelt anspringt?","answers":["Nicht unbedingt, aber es ist ein Verhalten, das man dem Hund frühzeitig abgewöhnen sollte.","Ja, Anspringen ist ein aggressives Verhalten.","Nein, das Anspringen ist als Spielaufforderung zu verstehen.","Nein, es ist ein Zeichen großer Zuneigung."],"correct":[0],"multi":false,"source":"Buch","bookNumber":101,"explanation":"Richtig: Nicht unbedingt, aber es ist ein Verhalten, das man dem Hund frühzeitig abgewöhnen sollte.."},{"id":"buch-102","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Welche Gesten sind Anzeichen von Aggression ohne Zeichen von Angst oder Stress?","answers":["Der Hund macht sich klein und versucht zu fliehen.","Er hechelt und hat dabei den Schwanz eingeklemmt und die Ohren nach hinten gelegt.","Er gähnt und leckt sich häufig über die Nase.","Er hat die Ohren nach vorne gestellt und zieht die Lefzen hoch."],"correct":[3],"multi":false,"source":"Buch","bookNumber":102,"explanation":"Richtig: Er hat die Ohren nach vorne gestellt und zieht die Lefzen hoch.."},{"id":"buch-103","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Ihr Hund knurrt jeden Besuch an, der zu Ihnen kommt und den Hund streicheln will. Was tun Sie?","answers":["Hier ist ein Verhaltenstraining sinnvoll. Sie holen sich professionellen Rat.","Sie erklären dem Hund, dass er das nicht tun darf.","Sie fassen das Tier im Nackenfell und schütteln es, damit es nicht mehr aggressiv ist.","Als einzige Maßnahme informieren Sie Ihren Besuch, dass der Hund keine intensive Kontaktaufnahme mag."],"correct":[0],"multi":false,"source":"Buch","bookNumber":103,"explanation":"Richtig: Hier ist ein Verhaltenstraining sinnvoll. Sie holen sich professionellen Rat.."},{"id":"buch-104","topic":"angst_stress_aggression","topicName":"Angst, Stress & Aggression","question":"Ihr eigener Hund knurrt Sie seit einigen Tagen immer an, wenn Sie ihn auf dem Rücken streicheln. Was tun Sie?","answers":["Sie suchen einen Tierarzt auf und lassen Ihren Hund untersuchen.","Sie streicheln den Hund nicht mehr auf dem Rücken.","Sie schimpfen laut mit ihm.","Sie streicheln ihn nur an diesen Stellen, um ihn zu provozieren."],"correct":[0],"multi":false,"source":"Buch","bookNumber":104,"explanation":"Richtig: Sie suchen einen Tierarzt auf und lassen Ihren Hund untersuchen.."},{"id":"buch-105","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Sind Hunde immer noch Raubtiere?","answers":["Ja, in verschieden starker Ausprägung.","Ja, aber nur Jagdhunde.","Nein, Jagen ist eine Verhaltensstörung.","Nein, nur in seltenen Ausnahmefällen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":105,"explanation":"Richtig: Ja, in verschieden starker Ausprägung.."},{"id":"buch-106","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Sind unsere heutigen Hunde immer noch Jäger?","answers":["Ja, rassebedingt in unterschiedlicher Ausprägung.","Nur, wenn man sie zur Jagd ausgebildet hat.","Nein, Jagdverhalten ist eine krankhafte Verhaltensstörung.","Nein, man konnte das Jagdverhalten durch Zucht völlig eliminieren."],"correct":[0],"multi":false,"source":"Buch","bookNumber":106,"explanation":"Richtig: Ja, rassebedingt in unterschiedlicher Ausprägung.."},{"id":"buch-107","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Ihr Hund heult und bellt, wenn Sie ohne ihn aus der Wohnung gehen. Was machen Sie?","answers":["Ich finde es gut, wenn mein Hund wachsam ist und viel bellt.","Die Nachbarn müssen sich daran gewöhnen, deshalb mache ich nichts.","Ich suche mir professionellen Rat.","Ich gehe umgehend zurück und bestrafe ihn."],"correct":[2],"multi":false,"source":"Buch","bookNumber":107,"explanation":"Richtig: Ich suche mir professionellen Rat.."},{"id":"buch-108","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Wie reagieren Sie, wenn Sie aus der Wohnung gehen und Ihren Hund Minuten später bellen oder heulen hören?","answers":["Ich gehe sofort zurück und bestrafe ihn, denn er muss leise sein, wenn ich nicht da bin.","Ich mache gar nichts, denn ich finde es gut, dass mein Hund wachsam ist und viel bellt.","Ich mache nichts, denn die Nachbarn müssen sich daran gewöhnen.","Ich suche professionellen Rat."],"correct":[3],"multi":false,"source":"Buch","bookNumber":108,"explanation":"Richtig: Ich suche professionellen Rat.."},{"id":"buch-109","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Wie bringt man dem Hund bei, zu Hause zu bleiben?","answers":["Er bleibt im ersten Lebensjahr niemals alleine zu Hause.","Man steigert die Dauer des Alleinbleibens schrittweise.","Man lässt ihn direkt mehrere Stunden alleine.","Man sperrt ihn in einen dunklen Raum."],"correct":[1],"multi":false,"source":"Buch","bookNumber":109,"explanation":"Richtig: Man steigert die Dauer des Alleinbleibens schrittweise.."},{"id":"buch-110","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Sie kommen nach Hause und stellen fest, dass Ihr Hund während Ihrer Abwesenheit Gegenstände zerstört hat. Wie reagieren Sie?","answers":["Sie bestrafen den Hund sofort nach Ihrer Rückkehr.","Sie überprüfen die Ursachen und trainieren das Alleinbleiben schrittweise.","Sie ignorieren das Problem vollständig.","Sie lassen den Hund zukünftig grundsätzlich draußen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":110,"explanation":"Richtig: Sie überprüfen die Ursachen und trainieren das Alleinbleiben schrittweise."},{"id":"buch-111","topic":"haltung_beschaeftigung","topicName":"Haltung & Beschäftigung","question":"Welche Aussage zum Alleinbleiben des Hundes ist richtig?","answers":["Das Alleinbleiben muss nicht trainiert werden.","Jeder Hund kann von Anfang an mehrere Stunden alleine bleiben.","Das Alleinbleiben sollte schrittweise aufgebaut und an den individuellen Hund angepasst werden.","Hunde sollten beim Alleinbleiben immer angebunden werden."],"correct":[2],"multi":false,"source":"Buch","bookNumber":111,"explanation":"Richtig: Das Alleinbleiben sollte schrittweise aufgebaut und an den individuellen Hund angepasst werden.."},{"id":"buch-112","topic":"ernaehrung","topicName":"Ernährung","question":"Was ist bei der Fütterung eines Hundes zu beachten?","answers":["Ein ausgewachsener Hund muss ständig Zugang zu Futter haben.","Die Futtermenge sollte an Alter, Größe und Aktivität des Hundes angepasst werden.","Hunde dürfen ausschließlich rohes Fleisch bekommen.","Die Zusammensetzung des Futters spielt keine Rolle."],"correct":[1],"multi":false,"source":"Buch","bookNumber":112,"explanation":"Richtig: Die Futtermenge sollte an Alter, Größe und Aktivität des Hundes angepasst werden.."},{"id":"buch-113","topic":"ernaehrung","topicName":"Ernährung","question":"Wie oft sollte ein ausgewachsener Hund gefüttert werden?","answers":["Ein- bis zweimal täglich.","Alle zwei Tage.","Nur einmal wöchentlich.","Futter sollte immer unbegrenzt zur Verfügung stehen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":113,"explanation":"Richtig: Ein- bis zweimal täglich.."},{"id":"buch-114","topic":"ernaehrung","topicName":"Ernährung","question":"Was ist nach der Fütterung zu beachten?","answers":["Der Hund sollte anschließend eine Ruhephase einhalten.","Direkt nach dem Fressen sollte intensiv gespielt werden.","Der Hund sollte unmittelbar lange laufen.","Nach der Fütterung ist keine besondere Rücksicht nötig."],"correct":[0],"multi":false,"source":"Buch","bookNumber":114,"explanation":"Richtig: Der Hund sollte anschließend eine Ruhephase einhalten.."},{"id":"buch-115","topic":"ernaehrung","topicName":"Ernährung","question":"Welche Aussage zur Ernährung des Hundes ist richtig?","answers":["Jeder Hund benötigt dieselbe Futtermenge.","Die Futterration muss dem individuellen Bedarf des Hundes angepasst werden.","Nur Fleisch ist eine vollständige Ernährung.","Leckerchen müssen bei der Tagesration nicht berücksichtigt werden."],"correct":[1],"multi":false,"source":"Buch","bookNumber":115,"explanation":"Richtig: Die Futterration muss dem individuellen Bedarf des Hundes angepasst werden.."},{"id":"buch-116","topic":"ernaehrung","topicName":"Ernährung","question":"Was muss einem Hund jederzeit zur Verfügung stehen?","answers":["Frisches Trinkwasser.","Trockenfutter.","Milch.","Knochen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":116,"explanation":"Richtig: Frisches Trinkwasser.."},{"id":"buch-117","topic":"ernaehrung","topicName":"Ernährung","question":"Was sollte zur regelmäßigen Gesundheitskontrolle eines Hundes gehören?","answers":["Kontrolle von Fell, Haut, Augen, Ohren und Zähnen.","Nur das Körpergewicht.","Nur die Krallen.","Eine Kontrolle ist nur bei Krankheit notwendig."],"correct":[0],"multi":false,"source":"Buch","bookNumber":117,"explanation":"Richtig: Kontrolle von Fell, Haut, Augen, Ohren und Zähnen.."},{"id":"buch-118","topic":"ernaehrung","topicName":"Ernährung","question":"Welche Aussage zur Körperpflege ist richtig?","answers":["Regelmäßige Pflege hilft, Veränderungen und Parasiten frühzeitig zu erkennen.","Hunde müssen täglich gebadet werden.","Fellpflege ist nur bei langhaarigen Hunden notwendig.","Pflege ist ausschließlich Sache des Tierarztes."],"correct":[0],"multi":false,"source":"Buch","bookNumber":118,"explanation":"Richtig: Regelmäßige Pflege hilft, Veränderungen und Parasiten frühzeitig zu erkennen.."},{"id":"buch-119","topic":"ernaehrung","topicName":"Ernährung","question":"Welche Aussage zu den Sinnesleistungen des Hundes ist richtig?","answers":["Der Hund sieht grundsätzlich besser als der Mensch.","Der Geschmackssinn ist der wichtigste Sinn des Hundes.","Der Geruchssinn des Hundes ist besonders leistungsfähig.","Hunde hören schlechter als Menschen."],"correct":[2],"multi":false,"source":"Buch","bookNumber":119,"explanation":"Richtig: Der Geruchssinn des Hundes ist besonders leistungsfähig.."},{"id":"buch-120","topic":"ernaehrung","topicName":"Ernährung","question":"Wann sollte ein Tierarzt aufgesucht werden?","answers":["Nur bei sichtbaren Verletzungen.","Bei deutlichen oder anhaltenden Veränderungen des Gesundheitszustandes.","Erst wenn der Hund nicht mehr laufen kann.","Nur zur Impfung."],"correct":[1],"multi":false,"source":"Buch","bookNumber":120,"explanation":"Richtig: Bei deutlichen oder anhaltenden Veränderungen des Gesundheitszustandes.."},{"id":"buch-121","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Was sind die typischen Symptome einer Scheinträchtigkeit?","answers":["Die Hündin hat ein vermehrtes Hungergefühl.","Spielzeug wird umhergetragen und behütet.","Die Hündin hat vermehrt Durst.","Die Hündin schläft den ganzen Tag."],"correct":[1],"multi":false,"source":"Buch","bookNumber":121,"explanation":"Richtig: Spielzeug wird umhergetragen und behütet.."},{"id":"buch-122","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Was sollte man beachten, wenn man mit seiner läufigen Hündin spazieren geht?","answers":["Bei der ersten Läufigkeit kann noch nichts passieren, die Hündin kann dann noch nicht tragend werden.","Man sollte die Hündin während der gesamten Läufigkeit an der Leine führen.","Manche Hündinnen reagieren während der Läufigkeit Rüden gegenüber aggressiver als sonst.","Die Hündin setzt während der Läufigkeit oft keinen Harn ab. Man muss deshalb zum Tierarzt gehen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":122,"explanation":"Richtig: Man sollte die Hündin während der gesamten Läufigkeit an der Leine führen.."},{"id":"buch-123","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Bei einer Kastration werden:","answers":["Beim männlichen Tier die Hoden entfernt, weibliche Tiere werden sterilisiert.","Die Hoden bzw. Eierstöcke entfernt.","Die Eileiter bzw. die Samenleiter durchtrennt.","Die Tiere vorübergehend zeugungsunfähig gemacht."],"correct":[1],"multi":false,"source":"Buch","bookNumber":123,"explanation":"Richtig: Die Hoden bzw. Eierstöcke entfernt.."},{"id":"buch-124","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Welche der folgenden Aussagen ist richtig?","answers":["Rüden sind in der Regel ab dem 8. Lebensjahr nicht mehr zeugungsfähig.","Hündinnen werden mit Eintritt der Geschlechtsreife läufig. Die Läufigkeit tritt in der Regel zweimal im Jahr auf und dies ein Leben lang. Während der Läufigkeit ist die Hündin fruchtbar und fortpflanzungsfähig.","Hündinnen können ab dem ersten Tag der Läufigkeit erfolgreich gedeckt werden.","Hündinnen können nur in der Zeit zwischen dem 11.–13. Tag der Läufigkeit tragend werden."],"correct":[1],"multi":false,"source":"Buch","bookNumber":124,"explanation":"Richtig: Hündinnen werden mit Eintritt der Geschlechtsreife läufig. Die Läufigkeit tritt in der Regel zweimal im Jahr auf und dies ein Leben lang. Während der Läufigkeit ist die Hündin fruchtbar und fortpflanzungsfähig.."},{"id":"buch-125","topic":"rassen_genetik_zucht","topicName":"Rassen, Genetik & Zucht","question":"Man ertappt zwei Hunde beim Deckakt in der Phase des „Hängens“. Was kann man tun?","answers":["Man sollte den Rüden so schnell wie möglich von der Hündin wegreißen, wenn kein Nachwuchs erwünscht ist.","Man kann in diesem Moment nichts mehr tun. Die Tiere müssen sich selbst voneinander lösen.","Man übergießt die Hunde mit kaltem Wasser.","Man versucht durch Ziehen an beiden Hunden die Verbindung zu lösen."],"correct":[1],"multi":false,"source":"Buch","bookNumber":125,"explanation":"Richtig: Man kann in diesem Moment nichts mehr tun. Die Tiere müssen sich selbst voneinander lösen.."},{"id":"buch-126","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Was versteht man unter Ektoparasiten?","answers":["Parasiten, die auf der Körperoberfläche des Hundes leben, z. B. Flöhe, Zecken oder Milben.","Parasiten der inneren Organe.","Nur Würmer im Darm.","Bakterien im Blut."],"correct":[0],"multi":false,"source":"Buch","bookNumber":126,"explanation":"Richtig: Parasiten, die auf der Körperoberfläche des Hundes leben, z. B. Flöhe, Zecken oder Milben."},{"id":"buch-127","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Welche der folgenden Parasiten gehören zu den Ektoparasiten?","answers":["Spulwürmer und Bandwürmer.","Giardien und Kokzidien.","Flöhe, Zecken und Milben.","Herzwürmer."],"correct":[2],"multi":false,"source":"Buch","bookNumber":127,"explanation":"Richtig: Flöhe, Zecken und Milben.."},{"id":"buch-128","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Was sind Endoparasiten?","answers":["Parasiten, die Hundeohren befallen.","Parasiten der inneren Organe, Körperhöhlen und Gewebe, zum Beispiel: Würmer.","Flöhe.","Zecken.","Milben."],"correct":[1],"multi":false,"source":"Buch","bookNumber":128,"explanation":"Richtig: Parasiten der inneren Organe, Körperhöhlen und Gewebe, zum Beispiel: Würmer.."},{"id":"buch-129","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Ihr Hund schüttelt seit Tagen ständig den Kopf. Was sollten Sie tun?","answers":["Der Hund hat Schmutz in den Ohren, Sie spülen ihm mit reichlich Seifenlösung die Ohren aus.","Der Hund könnte eine Ohrenentzündung haben, Sie konsultieren Ihren Tierarzt.","Der Hund ist mit etwas unzufrieden und tut so seinen Unwillen kund. Sie überprüfen, ob er genug Futter bekommt.","Kopfschütteln gehört zum Spielaufforderungsverhalten, Sie spielen mehr mit ihm."],"correct":[1],"multi":false,"source":"Buch","bookNumber":129,"explanation":"Richtig: Der Hund könnte eine Ohrenentzündung haben, Sie konsultieren Ihren Tierarzt.."},{"id":"buch-130","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Welche Vorsorgemaßnahmen sollten zur Gesunderhaltung des Hundes getroffen werden?","answers":["Den Hund beim Tierarzt untersuchen lassen und bei Bedarf entwurmen.","Den Hund jede Woche einmal mit Flohshampoo waschen.","Darauf achten, dass der Hund immer einen gefüllten Fressnapf hat.","Nur das teuerste Futter kaufen."],"correct":[0],"multi":false,"source":"Buch","bookNumber":130,"explanation":"Richtig: Den Hund beim Tierarzt untersuchen lassen und bei Bedarf entwurmen.."},{"id":"buch-131","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Gibt es Dinge, die man prophylaktisch tun kann, damit der Hund gesund bleibt?","answers":["Ja, der Hund sollte z.B. regelmäßig geimpft werden.","Ja, man sollte den ganzen Körper z.B. beim Bürsten alle 3 Monate anschauen, um Veränderungen oder Parasitenbefall zu erkennen.","Ja, der Hund sollte nur das teuerste Futter bekommen. Das ist in aller Regel auch das Beste.","Ja, einmal wöchentlich sollte man den Hund baden."],"correct":[0],"multi":false,"source":"Buch","bookNumber":131,"explanation":"Richtig: Ja, der Hund sollte z.B. regelmäßig geimpft werden.."},{"id":"buch-132","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Sie bemerken im Fell Ihres Hundes kleine, schwarze Krümel und haben auch schon schmale, dunkle, ca. 2 mm lange Lebewesen auf ihm laufen sehen. Was bedeutet das?","answers":["Es besteht der Verdacht eines Flohbefalls.","Diese kleinen Tiere sind meist Grasfliegen, die kein gesundheitliches Problem für den Hund darstellen.","Der Hund hat sich sicher im Unrat gewälzt; baden Sie ihn mit Shampoo.","Man sollte den Hund scheren, denn das ist Läusebefall."],"correct":[0],"multi":false,"source":"Buch","bookNumber":132,"explanation":"Richtig: Es besteht der Verdacht eines Flohbefalls.."},{"id":"buch-133","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Wie wird Tollwut übertragen?","answers":["Durch Körperkontakt mit einem tollwuterkrankten Tier.","Wenn Speichel eines tollwuterkrankten Tieres in die Blutbahn kommt, z.B. durch einen Biss.","Durch das Anfassen von Fuchskot.","Mücken stellen unter anderem eine gefährliche Infektionsquelle für Tollwut dar."],"correct":[1],"multi":false,"source":"Buch","bookNumber":133,"explanation":"Richtig: Wenn Speichel eines tollwuterkrankten Tieres in die Blutbahn kommt, z.B. durch einen Biss.."},{"id":"buch-134","topic":"gesundheit_erste_hilfe","topicName":"Gesundheit & Erste Hilfe","question":"Wann sollte ein erwachsener Hund entwurmt werden?","answers":["Durch eine regelmäßige Entwurmung werden eventuell vorhandene Würmer abgetötet.","Wenn der Hund abnimmt, hat er bestimmt Würmer und muss vier Wochen lang wöchentlich entwurmt werden.","Wenn er aus dem After blutet.","Ein erwachsener Hund muss gar nicht mehr entwurmt werden."],"correct":[0],"multi":false,"source":"Buch","bookNumber":134,"explanation":"Rich
